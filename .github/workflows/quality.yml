name: quality

# The critical checks of Phase 14 §54, on every push and pull request:
# correctness suites, the test suite, and the frontend's own gates. The heavier
# engine and load runs are deliberately *not* here — they need a Stockfish binary
# and real concurrency, so they are run before a release rather than on every
# commit. CI that is too slow to read is CI nobody reads.
#
# Nothing here needs Postgres or Redis: the tests build their own SQLite database
# (tests/conftest.py). Stockfish *is* installed in the backend and browser jobs,
# because several tests drive a real analysis run end to end and fail with
# "Stockfish binary not found" without it; the engine-marked suite is still
# excluded from the backend job by policy (`run_evaluation.py --no-engine`).

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/argus[ml,dev]" -e apps/api

      # The suite is engine-free by policy, not by accident: several tests drive
      # a real analysis run (import -> analyse -> read the report) and fail with
      # "Stockfish binary not found" when the binary is absent. Apt installs it
      # at /usr/games/stockfish, which locate_stockfish already searches.
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Static correctness (ruff F, E9)
        run: python -m ruff check packages apps scripts tests

      - name: Configuration validation (development)
        run: python scripts/validate_config.py --environment development

      - name: Configuration validation refuses an open production
        run: |
          # A production deployment with no API keys must fail validation. This
          # asserts the *rule*, not just that the command runs.
          if python scripts/validate_config.py --environment production; then
            echo "Expected production validation to fail without keys." >&2
            exit 1
          fi

      - name: Evaluation framework (engine skipped with a reason)
        run: python scripts/run_evaluation.py --no-engine --quiet

      - name: Test suite (engine-marked tests excluded)
        run: python -m pytest -p no:warnings -o addopts= -q -m "not engine"

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation/reports/
          if-no-files-found: ignore

  security:
    # Supply-chain and configuration scanning (§31, §33). The secrets scanner
    # fails the build on a committed credential, which is the failure this repo
    # most needs to catch: a leaked key is a production incident, not a lint.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/argus[ml,dev]" -e apps/api pip-audit

      - name: Python dependency audit
        run: python -m pip_audit --skip-editable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Frontend dependency audit
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          # The shipped dependency tree, which is the policy
          # scripts/audit_dependencies.py already applies. A dev-only advisory is
          # reported by the step below rather than blocking the build: braces has
          # no patched release at all (GHSA-vfj7-8cjw-p6xm: affected <= 3.0.3,
          # patched "none"), it is reachable only through eslint-config-next, and
          # no part of that toolchain is in the runtime image. Trivy's
          # ignore-unfixed covers the same class for containers.
          npm audit --omit=dev --audit-level=high

      - name: Frontend dev-toolchain advisories (reported, not blocking)
        # Kept visible so an unpatchable dev dependency stays in the record and a
        # *patched* one is obvious the moment the registry publishes a fix. It
        # does not gate: none of these packages ship, so their presence is not a
        # reason to stop a release.
        working-directory: apps/web
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Secret, misconfiguration and vulnerability scan
        # Pinned by tag. v0.28.0 is broken: it references
        # aquasecurity/setup-trivy@v0.2.1, a tag that was never published, so the
        # action could not resolve and the job died during setup. Versions from
        # v0.31.0 pin that dependency by commit SHA instead, which always
        # resolves. The Trivy DB is downloaded at run time, so this pins the
        # wrapper, not the vulnerability data.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      # `LayoutProps` (used by app/layout.tsx) is generated into .next/types,
      # which is gitignored. On a fresh checkout there is no build yet, so
      # type-check would fail with "Cannot find name 'LayoutProps'". Generating
      # the route types first keeps type-check independent of build order.
      - name: Generate route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  browser:
    # The browser + accessibility suite (§35/§36). It boots a real API and web
    # server, so the pages are scanned with real data rather than an empty shell.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/argus[ml,dev]" -e apps/api

      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Install frontend
        working-directory: apps/web
        run: npm ci

      # All three engines in playwright.config.ts (chromium, firefox, webkit)
      # are installed: the suite claims cross-engine behaviour, so it must run
      # there. Installing chromium alone makes firefox and webkit fail to launch
      # and takes two thirds of the matrix with them.
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Start the API (SQLite)
        run: |
          ARGUS_DATABASE_URL=sqlite:///./ci-e2e.db \
            python -m uvicorn argus_api.main:app --port 8002 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8002/health >/dev/null && break || sleep 2
          done

      # The five user journeys (§50) run start-to-finish against the same live
      # API + engine, so the sequence is exercised rather than only the pieces.
      # They run *first* deliberately: journey 1 imports and analyses a real game,
      # which is what gives the browser suite a populated library. Data-dependent
      # pages (the map's neighbourhood, a finished game's report) then assert
      # against real relationships instead of skipping for want of a fixture.
      - name: User journeys (end to end)
        run: python scripts/verify_journeys.py

      # Journey 1 imported and analysed a real game, which is *domain* data, not
      # graph data: the intelligence graph is materialized from the domain, not
      # derived on read. Rebuild it from what is now stored, or the map's
      # neighbourhood and the "Why?" traces have nothing to draw and the
      # data-dependent specs skip in CI forever. Verified locally: a rebuild after
      # one imported game gives its players a 40-node neighbourhood.
      - name: Materialize the intelligence graph
        run: |
          curl -sf -X POST "http://127.0.0.1:8002/api/graph/rebuild" >/dev/null
          curl -sf "http://127.0.0.1:8002/api/graph/health" | head -c 300; echo

      - name: Browser + accessibility tests
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
