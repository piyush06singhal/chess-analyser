[project]
name = "argus-api"
version = "0.1.0"
description = "ARGUS Chess API service (FastAPI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.3",
    "argus>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["argus_api*"]
